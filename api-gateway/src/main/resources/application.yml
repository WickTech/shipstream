spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@remoteAddrKeyResolver}"
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1

        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/shipments/**
          filters:
            - StripPrefix=1

        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tracking/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    export:
      prometheus:
        enabled: true

  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
