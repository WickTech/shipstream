services:

  # ─── Kafka KRaft (single broker, no ZooKeeper) ────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: shipstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── Kafka topic initializer ───────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: shipstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created         --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.cancelled       --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shipments.created      --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shipments.status_changed --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tracking.events        --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notifications.dlq      --partitions 3 --replication-factor 1 --config retention.ms=604800000
      echo 'Topics created.'
      "

  # ─── Apicurio Schema Registry ─────────────────────────────────────────────
  apicurio:
    image: apicurio/apicurio-registry:3.0.7
    container_name: shipstream-apicurio
    ports:
      - "8090:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/apis/registry/v3/system/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL (all service schemas in one instance for local dev) ────────
  postgres:
    image: postgres:17
    container_name: shipstream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shipstream
      POSTGRES_PASSWORD: shipstream
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Valkey (Redis-compatible, open source) ────────────────────────────────
  valkey:
    image: valkey/valkey:8
    container_name: shipstream-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Jaeger (distributed tracing) ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:2.4.0
    container_name: shipstream-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: shipstream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: shipstream-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  kafka-data:
  postgres-data:
  grafana-data:
