apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shipstream
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/wicktech/shipstream/api-gateway:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: shipstream-config
            - secretRef:
                name: shipstream-secret
          env:
            - name: PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shipstream
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8090
