apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: shipstream
  labels:
    app: tracking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: tracking-service
          image: ghcr.io/wicktech/shipstream/tracking-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: shipstream-config
            - secretRef:
                name: shipstream-secret
          env:
            - name: PORT
              value: "8083"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: shipstream
spec:
  selector:
    app: tracking-service
  ports:
    - port: 8083
      targetPort: 8083
