apiVersion: v1
kind: Secret
metadata:
  name: shipstream-secret
  namespace: shipstream
type: Opaque
stringData:
  # DEV-ONLY placeholder values for a local cluster (kind/minikube). They are public
  # (committed to git) and are NOT secrets. Replace both before exposing anything:
  #   kubectl -n shipstream create secret generic shipstream-secret \
  #     --from-literal=DB_PASS=... \
  #     --from-literal=TRACKING_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  DB_PASS: shipstream
  # tracking-service refuses to start without this (min 16 chars).
  TRACKING_WEBHOOK_SECRET: dev-only-placeholder-not-a-secret
