name: Coverage Badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [order-service, shipment-service, tracking-service, notification-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25

      - name: Build & test ${{ matrix.module }}
        run: ./mvnw -pl common,${{ matrix.module }} -am verify --no-transfer-progress
        env:
          MAVEN_OPTS: --enable-preview

      - name: Extract line coverage
        id: cov
        run: |
          XML=./${{ matrix.module }}/target/site/jacoco/jacoco.xml
          MISSED=$(grep -oPm1 '(?<=<counter type="LINE" missed=")[^"]+' "$XML" || echo 0)
          COVERED=$(grep -oPm1 '(?<=covered=")[^"]+' <(grep 'type="LINE"' "$XML" | tail -1) || echo 0)
          TOTAL=$((MISSED + COVERED))
          PCT=$(( TOTAL > 0 ? COVERED * 100 / TOTAL : 0 ))
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Generate badge JSON
        run: |
          PCT=${{ steps.cov.outputs.pct }}
          COLOR=$([ "$PCT" -ge 80 ] && echo "brightgreen" || ([ "$PCT" -ge 70 ] && echo "yellow" || echo "red"))
          mkdir -p badges
          cat > badges/${{ matrix.module }}.json <<EOF
          { "schemaVersion": 1, "label": "coverage", "message": "${PCT}%", "color": "${COLOR}" }
          EOF

      - name: Push badge to badges branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: badges
          destination_dir: ${{ matrix.module }}
          keep_files: true
